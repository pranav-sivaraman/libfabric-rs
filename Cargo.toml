[package]
name         = "libfabric-rs"
version      = "0.1.0"
authors      = ["Pranav Sivaraman"]
edition      = "2024"
rust-version = "1.85"
description  = "Idiomatic Rust bindings for libfabric"
readme       = "README.md"
repository   = "https://github.com/pranav-sivaraman/libfabric-rs"
license      = "BSD-2-Clause OR GPL-2.0-only"
keywords     = ["HPC", "libfabric", "RDMA"]
categories   = ["api-bindings", "network-programming"]

[dependencies]
ofi-libfabric-sys = "0.2.0"

[lints.clippy]
all      = "warn"
pedantic = "warn"
cargo    = "warn"
